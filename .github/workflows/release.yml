name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version and signing secrets
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)"

          test "$GITHUB_REF_NAME" = "v$version"
          test "$tauri_version" = "$version"
          test "$cargo_version" = "$version"
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          if draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$draft" = "true"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "See See v${{ steps.version.outputs.version }}"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            targets: ""
            args: "--bundles nsis,msi"
          - platform: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - platform: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - run: npm ci

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "See See Local Release"
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/see-see-certificate.p12"
          keychain_path="$RUNNER_TEMP/see-see-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild \
            -k "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          keychains=()
          while IFS= read -r keychain; do
            keychain="${keychain#*\"}"
            keychain="${keychain%\"}"
            keychains+=("$keychain")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}" "$keychain_path"
          security find-certificate \
            -c "$APPLE_SIGNING_IDENTITY" \
            "$keychain_path" > /dev/null
          security find-key \
            -t private \
            -s \
            -l "$APPLE_SIGNING_IDENTITY" \
            "$keychain_path" > /dev/null

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: "See See Local Release"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          releaseAssetNamePattern: "See-See_[version]_[platform]_[arch][setup][ext]"
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/see-see-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/see-see-certificate.p12"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify installers and publish release
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          version="${{ needs.prepare.outputs.version }}"

          expected_installers="$(cat <<EOF
          See-See_${version}_darwin_aarch64.app.tar.gz
          See-See_${version}_darwin_aarch64.app.tar.gz.sig
          See-See_${version}_darwin_aarch64.dmg
          See-See_${version}_darwin_x64.app.tar.gz
          See-See_${version}_darwin_x64.app.tar.gz.sig
          See-See_${version}_darwin_x64.dmg
          See-See_${version}_windows_x64-setup.exe
          See-See_${version}_windows_x64-setup.exe.sig
          See-See_${version}_windows_x64.msi
          See-See_${version}_windows_x64.msi.sig
          EOF
          )"
          actual_installers="$(grep -v '^latest\.json$' <<< "$assets")"
          diff \
            <(sort <<< "$expected_installers") \
            <(sort <<< "$actual_installers")

          test "$(grep -c '\.dmg$' <<< "$actual_installers")" -eq 2
          test "$(grep -c '\.msi$' <<< "$actual_installers")" -eq 1
          test "$(grep -c -- '-setup\.exe$' <<< "$actual_installers")" -eq 1
          test "$(grep -c '\.app\.tar\.gz$' <<< "$actual_installers")" -eq 2
          test "$(grep -c '\.app\.tar\.gz\.sig$' <<< "$actual_installers")" -eq 2

          release_id="$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)"
          release_assets="$(gh api "repos/$GH_REPO/releases/$release_id/assets?per_page=100")"
          asset_api_url() {
            local asset_name="$1"
            jq -er --arg name "$asset_name" \
              '.[] | select(.name == $name) | .url' <<< "$release_assets"
          }
          download_signature() {
            local asset_name="$1"
            local destination="$2"
            local asset_id
            asset_id="$(jq -er --arg name "$asset_name" \
              '.[] | select(.name == $name) | .id' <<< "$release_assets")"
            gh api --header 'Accept: application/octet-stream' \
              "repos/$GH_REPO/releases/assets/$asset_id" > "$destination"
            test -s "$destination"
          }

          arm_archive="See-See_${version}_darwin_aarch64.app.tar.gz"
          arm_signature="See-See_${version}_darwin_aarch64.app.tar.gz.sig"
          x64_archive="See-See_${version}_darwin_x64.app.tar.gz"
          x64_signature="See-See_${version}_darwin_x64.app.tar.gz.sig"
          nsis_archive="See-See_${version}_windows_x64-setup.exe"
          nsis_signature="See-See_${version}_windows_x64-setup.exe.sig"
          msi_archive="See-See_${version}_windows_x64.msi"
          msi_signature="See-See_${version}_windows_x64.msi.sig"
          mkdir -p "$RUNNER_TEMP/release"
          download_signature "$arm_signature" "$RUNNER_TEMP/release/$arm_signature"
          download_signature "$x64_signature" "$RUNNER_TEMP/release/$x64_signature"
          download_signature "$nsis_signature" "$RUNNER_TEMP/release/$nsis_signature"
          download_signature "$msi_signature" "$RUNNER_TEMP/release/$msi_signature"

          latest_json="$RUNNER_TEMP/release/latest.json"
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" \
            --rawfile arm_signature "$RUNNER_TEMP/release/$arm_signature" \
            --arg arm_url "$(asset_api_url "$arm_archive")" \
            --rawfile x64_signature "$RUNNER_TEMP/release/$x64_signature" \
            --arg x64_url "$(asset_api_url "$x64_archive")" \
            --rawfile nsis_signature "$RUNNER_TEMP/release/$nsis_signature" \
            --arg nsis_url "$(asset_api_url "$nsis_archive")" \
            --rawfile msi_signature "$RUNNER_TEMP/release/$msi_signature" \
            --arg msi_url "$(asset_api_url "$msi_archive")" \
            '{
              version: $version,
              notes: "",
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {signature: $arm_signature, url: $arm_url},
                "darwin-aarch64-app": {signature: $arm_signature, url: $arm_url},
                "darwin-x86_64": {signature: $x64_signature, url: $x64_url},
                "darwin-x86_64-app": {signature: $x64_signature, url: $x64_url},
                "windows-x86_64": {signature: $nsis_signature, url: $nsis_url},
                "windows-x86_64-nsis": {signature: $nsis_signature, url: $nsis_url},
                "windows-x86_64-msi": {signature: $msi_signature, url: $msi_url}
              }
            }' > "$latest_json"
          gh release upload "$GITHUB_REF_NAME" "$latest_json" --clobber

          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          expected_assets="$(cat <<EOF
          $expected_installers
          latest.json
          EOF
          )"
          diff \
            <(sort <<< "$expected_assets") \
            <(sort <<< "$assets")
          test "$(grep -c 'latest\.json$' <<< "$assets")" -eq 1

          jq -e --arg version "$version" '
            .version == $version and
            .platforms["windows-x86_64"].url and
            .platforms["windows-x86_64"].signature and
            .platforms["windows-x86_64-nsis"].url and
            .platforms["windows-x86_64-nsis"].signature and
            .platforms["windows-x86_64-msi"].url and
            .platforms["windows-x86_64-msi"].signature and
            .platforms["darwin-aarch64"].url and
            .platforms["darwin-aarch64"].signature and
            .platforms["darwin-aarch64-app"].url and
            .platforms["darwin-aarch64-app"].signature and
            .platforms["darwin-x86_64"].url and
            .platforms["darwin-x86_64"].signature and
            .platforms["darwin-x86_64-app"].url and
            .platforms["darwin-x86_64-app"].signature
          ' "$latest_json" > /dev/null

          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
