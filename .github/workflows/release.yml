name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version and signing secrets
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)"

          test "$GITHUB_REF_NAME" = "v$version"
          test "$tauri_version" = "$version"
          test "$cargo_version" = "$version"
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          if draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$draft" = "true"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "See See v${{ steps.version.outputs.version }}" \
              --notes $'## 安装包\n\n- Windows x64：选择 MSI 或 setup.exe。\n- macOS Apple Silicon：选择 aarch64 DMG。\n- macOS Intel：选择 x86_64 DMG。'
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            targets: ""
            args: "--bundles nsis,msi"
          - platform: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"
          - platform: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target x86_64-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - run: npm ci

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "See See Local Release"
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/see-see-certificate.p12"
          certificate_pem="$RUNNER_TEMP/see-see-certificate.pem"
          keychain_path="$RUNNER_TEMP/see-see-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild \
            -k "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-certificate \
            -c "$APPLE_SIGNING_IDENTITY" \
            -p "$keychain_path" > "$certificate_pem"
          security add-trusted-cert \
            -r trustRoot \
            -p codeSign \
            -k "$keychain_path" \
            "$certificate_pem"

          keychains=()
          while IFS= read -r keychain; do
            keychain="${keychain#*\"}"
            keychain="${keychain%\"}"
            keychains+=("$keychain")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" |
            grep -F "\"$APPLE_SIGNING_IDENTITY\""

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: "See See Local Release"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][setup].[ext]"
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Remove macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/see-see-signing.keychain-db" || true
          rm -f \
            "$RUNNER_TEMP/see-see-certificate.p12" \
            "$RUNNER_TEMP/see-see-certificate.pem"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify installers and publish release
        shell: bash
        run: |
          set -euo pipefail
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"

          test "$(grep -c '\.dmg$' <<< "$assets")" -eq 2
          test "$(grep -c '\.msi$' <<< "$assets")" -eq 1
          test "$(grep -c -- '-setup\.exe$' <<< "$assets")" -eq 1
          test "$(grep -c 'latest\.json$' <<< "$assets")" -eq 1

          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP/release"
          latest_json="$RUNNER_TEMP/release/latest.json"
          jq -e '
            .platforms["windows-x86_64"].url and
            .platforms["windows-x86_64"].signature and
            .platforms["darwin-aarch64"].url and
            .platforms["darwin-aarch64"].signature and
            .platforms["darwin-x86_64"].url and
            .platforms["darwin-x86_64"].signature
          ' "$latest_json" > /dev/null

          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
